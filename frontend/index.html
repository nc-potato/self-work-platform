<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自选股工作台</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">📊 工作台</h1>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item active" data-page="overview" href="#">
                <span class="nav-icon">📈</span> 市场概览
            </a>
            <a class="nav-item" data-page="stocks" href="#">
                <span class="nav-icon">💎</span> 自选股票
            </a>
            <a class="nav-item" data-page="etf" href="#">
                <span class="nav-icon">📦</span> ETF 跟踪
            </a>
            <a class="nav-item" data-page="futures" href="#">
                <span class="nav-icon">🛢️</span> 期货行情
            </a>
            <a class="nav-item" data-page="macro" href="#">
                <span class="nav-icon">🌐</span> 宏观数据
            </a>
            <a class="nav-item" data-page="settings" href="#">
                <span class="nav-icon">⚙️</span> 设置
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="update-badge" id="updateBadge">等待数据...</span>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 各页面由 JS 动态渲染 -->
    </main>

    <!-- 搜索弹窗 -->
    <div class="modal-overlay hidden" id="searchModal">
        <div class="modal">
            <div class="modal-header">
                <h2>🔍 搜索股票 / ETF</h2>
                <button class="close-btn" onclick="closeSearchModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="searchInput" class="search-input"
                       placeholder="输入股票代码或名称..." autofocus />
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="js/api.js"></script>
    <script src="js/lib/chart.js"></script>
    <script src="js/components/overview.js"></script>
    <script src="js/components/stocks.js"></script>
    <script src="js/components/etf.js"></script>
    <script src="js/components/futures.js"></script>
    <script src="js/components/macro.js"></script>
    <script src="js/components/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
